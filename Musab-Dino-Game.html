const obj = add([
    sprite("pixilart-drawing"),
    pos(200, 100),
    rotate(3),
    anchor("center"),// this keeps my characters spin pattern in the middle
    {
        dir: vec2(0, 0),
        speed: 1200, // 
    },
]);


obj.onUpdate(() => {
    obj.angle = obj.angle + 100 * dt();
});


obj.onUpdate(() => {
    obj.dir.x = 0;
    obj.dir.y = 0;

    if (isKeyDown("a")) obj.dir.x = -1;
    if (isKeyDown("d")) obj.dir.x = 1;
    if (isKeyDown("w")) obj.dir.y = -1;
    if (isKeyDown("s")) obj.dir.y = 1;
    if (isKeyDown("left")) obj.dir.x = -1;
    if (isKeyDown("right")) obj.dir.x = 1;
    if (isKeyDown("up")) obj.dir.y = -1;
    if (isKeyDown("down")) obj.dir.y = 1;

//what i did here is that i added move then just one movement control using the if statement.

    obj.move(
        obj.dir.unit().scale(obj.speed),
    );
});
// add tree
add([
    rect(48, 64),
    area(),
    body({ isStatic: true }),
    outline(4),
    pos(width(), height() - 48),
    anchor("botleft"),
    color(255, 180, 255),
    move(LEFT, 480),
]);
loop(1, () => {
    // add tree
    add([
        rect(48, 64),
        area(),
        body({ isStatic: true }),
        outline(4),
        pos(width(), height() - 48),
        anchor("botleft"),
        color(255, 180, 255),
        move(LEFT, 480),
        "tree", // add a tag here

});
// add platform
add([
    rect(width(), 48),
    pos(0, height() - 48),
    outline(4),
    area(),
    body({ isStatic: true }),
